/* ==========================================
   MAGGIE LOVER — PREMIUM CART
========================================== */

body{
  margin:0;
  background:#fffaf3;
  color:#28190c;
}

.cart-page{
  padding:0 4px 20px;
}


/* ==========================================
   CART HEADER
========================================== */

.cart-header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:18px 2px 15px;
}

.cart-back-btn{
  width:44px;
  height:44px;
  flex-shrink:0;
  border:0;
  border-radius:15px;
  background:#ffffff;
  color:#28190c;
  font-size:25px;
  font-weight:500;
  box-shadow:0 8px 22px rgba(55,35,10,.09);
  cursor:pointer;
}

.cart-header-text{
  flex:1;
  min-width:0;
}

.cart-header-text small{
  display:block;
  margin-bottom:3px;
  color:#a4773d;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
}

.cart-header-text h1{
  margin:0;
  color:#241608;
  font-size:21px;
  font-weight:900;
}

.cart-header-text p{
  margin:3px 0 0;
  color:#8c8175;
  font-size:12px;
}

.cart-header-icon{
  width:45px;
  height:45px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  background:linear-gradient(
    135deg,
    #ffb300,
    #ff7100
  );
  color:#fff;
  font-size:21px;
  box-shadow:
    0 10px 24px rgba(255,120,0,.25);
}


/* ==========================================
   EMPTY CART
========================================== */

.empty-cart{
  margin-top:12px;
  padding:45px 20px;
  text-align:center;
  background:#fff;
  border-radius:28px;
  box-shadow:
    0 12px 30px rgba(55,35,10,.07);
}

.empty-cart-icon{
  width:92px;
  height:92px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:30px;
  background:#fff3d7;
  font-size:44px;
}

.empty-cart h2{
  margin:0 0 7px;
  color:#25170b;
  font-size:23px;
  font-weight:900;
}

.empty-cart p{
  margin:0 0 22px;
  color:#8c8175;

}

.start-order-btn{

    #ffb000,

  text-decoration:none;

  font-weight:900;

}


/* ==========================================
   CART ITEMS TITLE
========================================== */

.cart-items-title{

  align-items:center;
  justify-content:space-between;

}

.cart-items-title h2{

  font-size:19px;
  font-weight:900;
}

.cart-items-title span{

}


/* ==========================================
   CART PRODUCT CARD
========================================== */

.cart-product{

  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
  padding:12px;
  background:#fff;
  border-radius:23px;

}

.cart-product-img{

  height:88px;

  border-radius:19px;

}

.cart-product-info{

}

.cart-product-info h3{

  font-size:15px;

  font-weight:900;
}

.cart-product-price{

  font-size:15px;
  font-weight:900;
}

.cart-product-total{

  color:#33200f;
  font-size:13px;
  font-weight:900;
}


/* ==========================================
   QUANTITY BOX
========================================== */

.quantity-box{

  align-items:center;
  width:max-content;
  overflow:hidden;
  border:1px solid #ffe0ad;
  border-radius:12px;

}

.quantity-box button{

}

.quantity-box span{

  color:#33200f;
  font-size:14px;
  font-weight:900;
}


/* ==========================================
   REMOVE BUTTON
========================================== */

.remove-cart-btn{
  position:absolute;
  top:10px;
  right:10px;
  width:31px;
  height:31px;
  border:0;
  border-radius:10px;
  background:#fff0ed;
  color:#df4d35;
  font-size:14px;
  cursor:pointer;
}


/* ==========================================
   BILL SUMMARY
========================================== */

.bill-summary{
  margin-top:18px;
  padding:19px;
  background:#fff;
  border-radius:25px;
  box-shadow:
    0 12px 30px rgba(50,30,10,.08);
}

.bill-summary-title{

}

.bill-row{

  padding:9px 0;

}

.bill-row strong{

}

.bill-divider{

.grand-total{

.grand-total span{

}

.grand-total strong{

/* ==========================================
   CHECKOUT BUTTON

.checkout-btn{

/* ==========================================

/* ==========================================
   RECOMMEND — TWO PRODUCTS PER ROW

.recommend-slider{

/* ==========================================

<script>
function normalizeImagePath(image){
  if(!image) return "";
  return String(image).replace(/^\.\.\/assets\//, "assets/").replace(/^\.\/assets\//, "assets/");
}


/* ==========================================
   MAGGIE LOVER — CART SYSTEM
========================================== */


/* ==========================================
   GET CART
========================================== */

function getCart(){

  try{

    const savedCart =
      localStorage.getItem("maggieCart");

    if(!savedCart){
      return [];
    }

    const cart =
      JSON.parse(savedCart);

    return Array.isArray(cart)
      ? cart
      : [];

  }catch(error){

    console.error(
      "Cart loading error:",
      error
    );

    return [];

  }

}


/* ==========================================
   EXACT PRODUCT CLICK
   CART → UNIVERSAL PRODUCT PAGE
========================================== */

function openExactCartProduct(index){

  const cart = getCart();

  if(
    !Array.isArray(cart) ||
    !cart[index]
  ){
    return;
  }

  const item = cart[index];

  const selectedProduct = {

    id:
      item.id,

    category:
      item.category || "",

    name:
      item.name || "",

    price:
      item.price || 0,

    image:
      item.image || "",

    description:
      item.description || "",

    tags:
      Array.isArray(item.tags)
        ? item.tags
        : []

  };

  localStorage.setItem(
    "selectedProduct",
    JSON.stringify(selectedProduct)
  );

  window.location.href =
    "product.html?id=" +
    encodeURIComponent(
      String(item.id)
    );

}


/* ==========================================
   SAVE CART
========================================== */

function saveCart(cart){

  localStorage.setItem(
    "maggieCart",
    JSON.stringify(cart)
  );

}


/* ==========================================
   CART COUNT
========================================== */

function updateCartCount(){

  const cart = getCart();

  const count =
    cart.reduce(
      (total,item) =>
        total + Number(item.qty || 0),
      0
    );

  const badge =
    document.getElementById(
      "bottomCartCount"
    );

  if(badge){

    badge.innerText = count;

    badge.style.display =
      count > 0
        ? "flex"
        : "none";

  }

}

/* ==========================================
   CHANGE QUANTITY
========================================== */

function changeQty(index, change){

  const cart = getCart();

  if(!cart[index]){
    return;
  }


  let currentQty =
    Number(cart[index].qty || 1);


  currentQty += change;


  /* REMOVE WHEN ZERO */

  if(currentQty <= 0){

    cart.splice(index,1);

  }else{

    cart[index].qty =
      currentQty;

  }


  saveCart(cart);

  renderCart();

}


/* ==========================================
   REMOVE PRODUCT
========================================== */

function removeItem(index){

  const cart = getCart();

  if(!cart[index]){
    return;
  }


  cart.splice(index,1);

  saveCart(cart);

  renderCart();

}


/* ==========================================
   ESCAPE HTML
   Prevents broken HTML if product name
   contains special characters.
========================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==========================================
   RENDER CART
========================================== */

function renderCart(){

  const cart =
    getCart();

  const cartItems =
    document.getElementById(
      "cartItems"
    );

  const cartSummary =
    document.getElementById(
      "cartSummary"
    );


  if(!cartItems || !cartSummary){
    return;
  }


  /* ========================================
     EMPTY CART
  ======================================== */

  if(cart.length === 0){

    cartItems.innerHTML = `

      <div class="empty-cart">

        <div class="empty-cart-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 4h2l2.4 11.5a2 2 0 0 0 2 1.5h8.8a2 2 0 0 0 1.9-1.4L22 8H6"/>
  <circle cx="10" cy="20" r="1.4"/>
  <circle cx="18" cy="20" r="1.4"/>
</svg>
        </div>

        <h2>
          Your Cart is Empty
        </h2>

        <p>
          Looks like you haven't added
          anything delicious yet.
        </p>

        <a
          href="index.html"
          class="start-order-btn"
        >
          Start Ordering →
        </a>

      </div>

    `;


    cartSummary.innerHTML = "";


    updateCartCount();

    return;

  }


  /* ========================================
     CART HAS PRODUCTS
  ======================================== */

  let subtotal = 0;

  let totalItems = 0;


  cartItems.innerHTML = `

    <div class="cart-items-title">

      <h2>
        Your Items
      </h2>

      <span id="itemsCount">
        0 items
      </span>

    </div>

  `;


  cart.forEach(
    (item,index) => {

      const price =
        Number(item.price) || 0;


      const qty =
        Number(item.qty) || 1;


      const itemTotal =
        price * qty;


      subtotal +=
        itemTotal;


      totalItems +=
        qty;


      const name =
        escapeHTML(
          item.name ||
          "Food Item"
        );


      const image =
        escapeHTML(
          item.image || ""
        );


      /* ======================================
         CART PRODUCT
         CARD CLICK → EXACT PRODUCT
      ====================================== */

      cartItems.innerHTML += `

        <div
          class="cart-product"
          onclick="openExactCartProduct(${index})"
          style="cursor:pointer;"
        >

          <img
            src="${normalizeImagePath(image)}"
            class="cart-product-img"
            alt="${name}"
            onerror="
              this.src='https://placehold.co/300x300?text=Food';
            "
          >


          <div class="cart-product-info">

            <h3>
              ${name}
            </h3>


            <div class="cart-product-price">
              ₹${price}
            </div>


            <div class="quantity-box">

              <button
                type="button"
                onclick="
                  event.stopPropagation();
                  changeQty(${index},-1)
                "
              >
                −
              </button>


              <span>
                ${qty}
              </span>


              <button
                type="button"
                onclick="
                  event.stopPropagation();
                  changeQty(${index},1)
                "
              >
                +
              </button>

            </div>


            <div class="cart-product-total">

              Item Total:
              ₹${itemTotal}

            </div>

          </div>


          <button
            type="button"
            class="remove-cart-btn"
            onclick="
              event.stopPropagation();
              removeItem(${index})
            "
            aria-label="Remove item"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="9"/>
  <path d="M8 12h8"/>
</svg>
          </button>

        </div>

      `;

    }
  );


  /* ========================================
     ITEM COUNT
  ======================================== */

  const itemsCount =
    document.getElementById(
      "itemsCount"
    );


  if(itemsCount){

    itemsCount.innerText =
      totalItems +
      (
        totalItems === 1
          ? " item"
          : " items"
      );

  }


  /* ========================================
     DELIVERY CHARGE
  ======================================== */

  const deliveryFee =
    50;


  /* ========================================
     GRAND TOTAL
  ======================================== */

  const grandTotal =
    subtotal +
    deliveryFee;


  /* ========================================
     BILL SUMMARY
  ======================================== */

  cartSummary.innerHTML = `

    <div class="bill-summary">

      <div class="bill-summary-title">
        Bill Summary
      </div>


      <div class="bill-row">

        <span>
          Product Total
        </span>

        <strong>
          ₹${subtotal}
        </strong>

      </div>


      <div class="bill-row">

        <span>
          Delivery Charge
        </span>

        <strong>
          ₹${deliveryFee}
        </strong>

      </div>


      <div class="delivery-note">

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 6h11v11H3z"/>
  <path d="M14 10h4l3 3v4h-7z"/>
  <circle cx="7" cy="19" r="1.5"/>
  <circle cx="18" cy="19" r="1.5"/>
</svg> Delivery charge is ₹50

      </div>


      <div class="bill-divider"></div>


      <div class="grand-total">

        <span>
          Grand Total
        </span>

        <strong>
          ₹${grandTotal}
        </strong>

      </div>


      <a
        href="checkout.html"
        class="checkout-btn"
      >
        Proceed to Checkout →
      </a>

    </div>

  `;


  /* UPDATE BADGE */

  updateCartCount();

}


/* ==========================================
   INITIALIZE CART
========================================== */

renderCart();

</script>

<script>

/* ==========================================
   MAGGIE LOVER
   RECOMMEND FOR YOU — PRODUCT LOADER
========================================== */

let recommendationProducts = [];


/* ==========================================
   LOAD PRODUCTS.JS
========================================== */

function loadProductDatabase(){

  return new Promise((resolve) => {

    /* Already loaded */

    if(
      Array.isArray(window.products) &&
      window.products.length > 0
    ){

      recommendationProducts =
        window.products;

      resolve(
        recommendationProducts
      );

      return;

    }


    /* Load products.js */

    const script =
      document.createElement("script");

    script.src =
      "products.js";


    script.onload = function(){

      if(
        Array.isArray(window.products)
      ){

        recommendationProducts =
          window.products;

      }else{

        recommendationProducts =
          [];

      }


      resolve(
        recommendationProducts
      );

    };


    script.onerror = function(){

      console.error(
        "products.js could not be loaded."
      );

      recommendationProducts =
        [];

      resolve([]);

    };


    document.body.appendChild(
      script
    );

  });

}


/* ==========================================
   GET PRODUCTS
========================================== */

function getAllProducts(){

  if(
    Array.isArray(window.products)
  ){

    return window.products;

  }

  return recommendationProducts;

}


/* ==========================================
   ADD PRODUCT TO CART
========================================== */

function addRecommendedProduct(
  productId
){

  const products =
    getAllProducts();


  const product =
    products.find(
      item =>
        Number(item.id) ===
        Number(productId)
    );


  if(!product){

    console.log(
      "Product not found:",
      productId
    );

    return;

  }


  const cart =
    getCart();


  const existing =
    cart.find(
      item =>
        Number(item.id) ===
        Number(product.id)
    );


  if(existing){

    existing.qty =
      Number(existing.qty || 0) + 1;

  }else{

    cart.push({

      id:
        product.id,

      category:
        product.category,

      name:
        product.name,

      price:
        Number(product.price) || 0,

      image:
        product.image,

      description:
        product.description,

      tags:
        product.tags,

      qty:
        1

    });

  }


  saveCart(cart);

  renderCart();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  }

  /* ==========================================
   OPEN EXACT PRODUCT FROM CART
========================================== */

function openExactCartProduct(index){

  const cart = getCart();

  if(!cart[index]){
    return;
  }

  const item = cart[index];

  /* Universal product.html ke liye
     exact selected product save karo */

  const exactProduct = {

    id:
      item.id,

    name:
      item.name,

    price:
      Number(item.price) || 0,

    category:
      item.category || "",

    image:
      item.image || "",

    description:
      item.description || "",

    tags:
      item.tags || []

  };


  try{

    localStorage.setItem(
      "selectedProduct",
      JSON.stringify(exactProduct)
    );

  }catch(error){

    console.error(
      "Selected product save error:",
      error
    );

    return;

  }


  /*
    Cart se product click karne par
    universal product.html open hoga.
  */

  window.location.href =
    "product.html";

}


/* ==========================================
   SHOW ALL PRODUCTS
========================================== */

function renderRecommendations(){

  const slider =
    document.getElementById(
      "recommendSlider"
    );


  if(!slider){
    return;
  }


  const products =
    getAllProducts();


  /* NO PRODUCTS */

  if(
    !Array.isArray(products) ||
    products.length === 0
  ){

    slider.innerHTML = `

      <div
        style="
          grid-column:1/-1;
          padding:25px;
          text-align:center;
          background:#fff;
          border-radius:20px;
          color:#8c8175;
        "
      >

        Products are currently
        unavailable.

      </div>

    `;

    return;

  }


  /* ========================================
     SHOW ALL PRODUCTS
  ======================================== */

  slider.innerHTML =
    products.map(
      (product,index) => {

        const id =
          Number(product.id);


        const name =
          escapeHTML(
            product.name ||
            "Food Item"
          );


        const price =
          Number(product.price) || 0;


        const image =
          escapeHTML(
            product.image || ""
          );


        return `

          <div
            class="recommend-card"
            onclick="openExactRecommendedProduct(${index})"
            style="cursor:pointer;"
          >

            <img
              src="${normalizeImagePath(image)}"
              alt="${name}"
              loading="lazy"
              onerror="
                this.src='https://placehold.co/600x500?text=Food';
              "
            >


            <div class="recommend-info">

              <h4>
                ${name}
              </h4>


              <p>
                ₹${price}
              </p>


              <button
                type="button"
                class="recommend-btn"
                onclick="
                  event.stopPropagation();
                  addRecommendedProduct(${id})
                "
              >

                + Add to Cart

              </button>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* ==========================================
   OPEN EXACT RECOMMENDED PRODUCT
========================================== */

function openExactRecommendedProduct(index){

  const products =
    getAllProducts();


  if(
    !Array.isArray(products) ||
    !products[index]
  ){

    return;

  }


  const product =
    products[index];


  const exactProduct = {

    id:
      product.id,

    name:
      product.name,

    price:
      Number(product.price) || 0,

    category:
      product.category || "",

    image:
      product.image || "",

    description:
      product.description || "",

    tags:
      product.tags || []

  };


  try{

    localStorage.setItem(
      "selectedProduct",
      JSON.stringify(exactProduct)
    );

  }catch(error){

    console.error(
      "Selected recommendation product save error:",
      error
    );

    return;

  }


  window.location.href =
    "product.html";

}


/* ==========================================
   START PRODUCT LOADING
========================================== */

async function initializeRecommendations(){

  await loadProductDatabase();

  renderRecommendations();

}


/* ==========================================
   START
========================================== */

initializeRecommendations();

</script>
