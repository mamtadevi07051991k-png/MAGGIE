<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style id="maggie-universal-bottom-navigation">
/* Universal fixed navigation: identical on every customer page */
html{scroll-padding-bottom:calc(76px + env(safe-area-inset-bottom)) !important;}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom)) !important;}
.bottom-nav{position:fixed !important;left:0 !important;right:0 !important;bottom:0 !important;top:auto !important;transform:none !important;width:100% !important;max-width:none !important;height:calc(66px + env(safe-area-inset-bottom)) !important;min-height:calc(66px + env(safe-area-inset-bottom)) !important;box-sizing:border-box !important;display:flex !important;flex-direction:row !important;align-items:center !important;justify-content:space-around !important;gap:0 !important;margin:0 !important;padding:5px 4px calc(5px + env(safe-area-inset-bottom)) !important;background:rgba(255,255,255,.98) !important;border-top:1px solid #eadfd3 !important;box-shadow:0 -4px 18px rgba(0,0,0,.09) !important;z-index:2147483000 !important;visibility:visible !important;opacity:1 !important;pointer-events:auto !important;}
.bottom-nav .nav-item{position:static !important;flex:1 1 20% !important;width:20% !important;max-width:20% !important;min-width:0 !important;height:54px !important;min-height:54px !important;margin:0 !important;padding:5px 0 !important;display:flex !important;flex-direction:column !important;align-items:center !important;justify-content:center !important;gap:3px !important;box-sizing:border-box !important;text-decoration:none !important;border:0 !important;border-radius:10px !important;background:transparent !important;color:#777 !important;font-size:11px !important;line-height:1.1 !important;white-space:nowrap !important;transform:none !important;}
.bottom-nav .nav-item svg{display:block !important;width:21px !important;height:21px !important;min-width:21px !important;min-height:21px !important;flex:0 0 21px !important;}
.bottom-nav .nav-item small,.bottom-nav .nav-item span{display:block !important;margin:0 !important;padding:0 !important;font-size:10px !important;line-height:12px !important;font-weight:500 !important;}
.bottom-nav .nav-item.active{color:#e56b24 !important;background:transparent !important;font-weight:700 !important;}
.bottom-nav .nav-item.active small,.bottom-nav .nav-item.active span{font-weight:700 !important;}
@media(min-width:700px){.bottom-nav{left:50% !important;right:auto !important;transform:translateX(-50%) !important;width:min(100%,520px) !important;border-left:1px solid #eadfd3 !important;border-right:1px solid #eadfd3 !important;border-radius:16px 16px 0 0 !important;}}
</style>
<!-- maggie-nav-prefetch -->

<link rel="prefetch" href="index.html" as="document">
<link rel="prefetch" href="categories.html" as="document">
<link rel="prefetch" href="cart.html" as="document">
<link rel="prefetch" href="orders.html" as="document">
<link rel="prefetch" href="account.html" as="document">
</head>
<body>

<div class="page-head">
  <button onclick="history.back()">←</button>
  <h2 id="title">Products</h2>
</div>

<div id="allProducts" class="mini-Grid"></div>

<script src="products.js"></script>
<script>

const params = new URLSearchParams(location.search);
const category = params.get('category');

document.getElementById('title').innerText = category;

function renderAllProducts(){ document.getElementById('allProducts').innerHTML = products.filter(p => p.category === category).map(p => `<div class="mini-card"><img src="${p.image}"><div class="mini-info"><h4>${p.name}</h4><div class="mini-price">₹${p.price}</div></div></div>`).join(''); }
renderAllProducts();
document.addEventListener('maggie:catalog-updated', renderAllProducts);

</script>

<script src="catalog-sync.js"></script>
<nav class="bottom-nav">

  href="index.html"
>

 <svg width="20" height="20" viewBox="0 0 24 24" fill="none"

  <rect x="4" y="4" width="6" height="6" rx="1"/>

  <circle cx="18" cy="20" r="1.2"/>
</svg>
<small>Cart</small>
</a>

<a
  class="nav-item"
  href="orders.html"
>
 <svg width="20" height="20" viewBox="0 0 24 24" fill="none"

     stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 7h14v14H5z"/>
  <path d="M8 7V5a4 4 0 0 1 8 0v2"/>

 </svg>

</svg>

</nav>

<script id="maggie-universal-nav-active">
document.addEventListener('DOMContentLoaded',function(){var p=(location.pathname.split('/').pop()||'index.html').toLowerCase();var map={'index.html':'index.html','categories.html':'categories.html','cart.html':'cart.html','orders.html':'orders.html','tracking.html':'orders.html','order-success.html':'orders.html','account.html':'account.html','search.html':'categories.html','see-all.html':'categories.html','product.html':'categories.html','checkout.html':'cart.html','buy.now.html':'cart.html'};var active=map[p]||'';document.querySelectorAll('.bottom-nav .nav-item').forEach(function(a){var href=(a.getAttribute('href')||'').toLowerCase();a.classList.toggle('active',!!active&&href===active);});});
</script>

<style id="maggie-final-identical-navigation">
/* Final shared navigation override: same dimensions and appearance on every page */
:root{--maggie-nav-height:66px;}
.bottom-nav{position:fixed!important;inset:auto 0 0 0!important;top:auto!important;left:0!important;right:0!important;transform:none!important;width:100%!important;max-width:none!important;height:calc(var(--maggie-nav-height) + env(safe-area-inset-bottom))!important;min-height:calc(var(--maggie-nav-height) + env(safe-area-inset-bottom))!important;box-sizing:border-box!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-around!important;gap:0!important;margin:0!important;padding:5px 4px calc(5px + env(safe-area-inset-bottom))!important;background:rgba(255,255,255,.98)!important;border-top:1px solid #eadfd3!important;box-shadow:0 -4px 18px rgba(0,0,0,.09)!important;z-index:2147483000!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;}
.bottom-nav .nav-item{position:static!important;flex:1 1 20%!important;width:20%!important;max-width:20%!important;min-width:0!important;height:54px!important;min-height:54px!important;margin:0!important;padding:5px 0!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:3px!important;box-sizing:border-box!important;text-decoration:none!important;border:0!important;border-radius:10px!important;background:transparent!important;color:#777!important;font-size:11px!important;line-height:1.1!important;white-space:nowrap!important;transform:none!important;}
.bottom-nav .nav-item svg{display:block!important;width:21px!important;height:21px!important;min-width:21px!important;min-height:21px!important;flex:0 0 21px!important;margin:0!important;}
.bottom-nav .nav-item small,.bottom-nav .nav-item span{display:block!important;margin:0!important;padding:0!important;font-size:10px!important;line-height:12px!important;font-weight:500!important;}
.bottom-nav .nav-item.active{color:#e56b24!important;background:transparent!important;font-weight:700!important;}
.bottom-nav .nav-item.active small,.bottom-nav .nav-item.active span{font-weight:700!important;}
body{padding-bottom:calc(82px + env(safe-area-inset-bottom))!important;}
@media(min-width:700px){.bottom-nav{left:50%!important;right:auto!important;transform:translateX(-50%)!important;width:min(100%,520px)!important;border-left:1px solid #eadfd3!important;border-right:1px solid #eadfd3!important;border-radius:16px 16px 0 0!important;}}
/* Keep navigation transitions smooth when supported; normal navigation remains fallback */
@view-transition{navigation:auto;}
::view-transition-old(root),::view-transition-new(root){animation-duration:160ms;}
</style>
