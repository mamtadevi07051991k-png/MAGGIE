html,body{touch-action:manipulation;-ms-touch-action:manipulation;overscroll-behavior-x:none;}


*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff8ed;
  color:#25170e;
}

.page{
  min-height:100vh;
  padding:16px;
  max-width:1100px;
  margin:auto;
}


/* ==========================================
   SEARCH BAR
========================================== */

.searchbar{
  position:sticky;
  top:10px;
  z-index:50;
  height:56px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 15px;
  background:#fff;
  border:1px solid #eadfce;
  border-radius:18px;
  box-shadow:0 7px 25px rgba(70,40,10,.10);
}

.search-icon{
  font-size:21px;
}

#search{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  font-size:16px;
}

#clear{
  display:none;
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  background:#f1ece5;
  font-size:20px;
}


/* ==========================================
   SECTION
========================================== */

.section{
  margin-top:25px;
}

.title{
  margin:0 0 13px;
  font-size:20px;
  font-weight:800;
}


/* ==========================================
   TRENDING
========================================== */

.trending{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.trend{
  padding:13px 15px;
  background:#fff;
  border:1px solid #eee2d3;
  border-radius:14px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}


/* ==========================================
   PRODUCTS
========================================== */

.products{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:14px;
}


/* ==========================================
   PRODUCT CARD
========================================== */

.card{
  overflow:hidden;
  background:#fff;
  border-radius:18px;
  box-shadow:
    0 6px 20px rgba(50,30,10,.09);
  cursor:pointer;
  transition:.18s;
}

.card:active{
  transform:scale(.98);
}

.card img{
  width:100%;
  height:155px;
  display:block;
  object-fit:cover;
  background:#eee;
}

.info{
  padding:12px;
}

.name{
  margin:0 0 5px;
  font-size:15px;
  line-height:1.3;
  font-weight:800;
}

.desc{
  margin:0 0 9px;
  color:#777;
  font-size:12px;
  line-height:1.4;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.price{
  font-size:16px;
  font-weight:900;
}


/* ==========================================
   EMPTY
========================================== */

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:50px 15px;
  color:#777;
}


/* ==========================================
   RESPONSIVE
========================================== */

@media(min-width:650px){

  .products{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

  .card img{
    height:190px;
  }

}

</style>

  /* =====================================================
   DESCRIPTION
===================================================== */

function description(p){

  const n=p.name.toLowerCase();

  if(n.includes("cheese"))
    return "Loaded with creamy cheese and delicious Maggie Lover flavours.";

  if(n.includes("paneer"))
    return "Delicious paneer prepared with rich spices and fresh ingredients.";

  if(n.includes("peri peri"))
    return "Spicy peri peri flavour with a delicious smoky and tangy taste.";

  if(n.includes("tandoori"))
    return "Smoky tandoori flavour prepared fresh with signature spices.";

  if(n.includes("schezwan"))
    return "Hot and spicy Schezwan preparation packed with flavour.";

  if(n.includes("biryani"))
    return "Aromatic biryani-style spices combined with delicious ingredients.";

  if(n.includes("momo"))
    return "Freshly prepared momos served with delicious Maggie Lover flavours.";

  if(n.includes("pizza"))
    return "Freshly baked pizza with delicious toppings and cheesy flavour.";

  if(n.includes("pasta"))
    return "Creamy, cheesy and flavourful pasta prepared fresh.";

  if(n.includes("maggi"))
    return "Freshly prepared Maggi with signature Maggie Lover spices.";

  return "Freshly prepared with delicious Maggie Lover flavours.";
}


/* =====================================================
   IMAGE
===================================================== */

function image(p,index){

  let keyword="food";

  if(p.category.includes("Maggi"))
    keyword="maggi,noodles";

  else if(p.category.includes("Pasta"))
    keyword="pasta";

  else if(p.category.includes("Pizza"))
    keyword="pizza";

  else if(p.category.includes("Momo"))
    keyword="momos";

  else if(p.category.includes("Paneer"))
    keyword="paneer,indian-food";

  else if(p.category.includes("Manchurian"))
    keyword="manchurian";

  return "https://loremflickr.com/700/500/"
    +encodeURIComponent(keyword)
    +"?lock="+(index+100);
}


/* =====================================================
   ELEMENTS
===================================================== */

const search =
document.getElementById("search");

const clear =
document.getElementById("clear");

const productsBox =
document.getElementById("products");

const heading =
document.getElementById("heading");

const trendingSection =
document.getElementById("trendingSection");

const trending =
document.getElementById("trending");


/* =====================================================
   TRENDING SEARCHES
===================================================== */

const trendingNames=[
  "Masala Handi Maggi",
  "Paneer Handi Maggi",
  "Triple Cheese Handi Maggi",
  "White Sauce Pasta",
  "Loaded Cheese Pasta",
  "Triple Cheese Maggi Pizza",
  "Dragon Momo",
  "Cheese Gravy Momo"
];

trendingNames.forEach(name=>{

  const div=document.createElement("div");

  div.className="trend";

  div.textContent="🔥 "+name;

  div.onclick=()=>{

    search.value=name;

    liveSearch(name);

  };

  trending.appendChild(div);

});


/* =====================================================
   CREATE CARD
===================================================== */

function card(p,index){

  const div=document.createElement("div");

  div.className="card";

  div.innerHTML=`

    <img
      src="${p.image}"
      alt="${p.name}"
      loading="lazy"
      onerror="this.src='https://placehold.co/700x500/F5EBDD/7A4B20?text=Maggie+Lover'"
    >

    <div class="info">

      <h3 class="name">
        ${p.name}
      </h3>

      <p class="desc">
        ${description(p)}
      </p>

      <div class="price">
        ₹${p.price}
      </div>

    </div>

  `;


  /* =================================================
     EXACT PRODUCT CLICK
  ================================================= */

  div.onclick=()=>{

    /*
      Product ka complete data save hoga.
      Isliye jis product par click hoga,
      wahi product.html mein open hoga.
    */

    const selectedProduct={

      id:
        p.id || (
          p.name.toLowerCase()
            .replace(/[^a-z0-9]+/g,"-")
        ),

      name:
        p.name,

      price:
        p.price,

      category:
        p.category || "",

      cat:
        p.category || "",

      description:
        description(p),

      image:
        p.image

    };


    localStorage.setItem(
      "selectedProduct",
      JSON.stringify(selectedProduct)
    );


    /* Universal product page */

    window.location.href =
      "product.html?id=" +
      encodeURIComponent(p.id);

  };


  return div;
}


/* =====================================================
   SHOW ALL PRODUCTS
===================================================== */

function showAll(){

  productsBox.innerHTML="";

  heading.textContent=
    "⭐ Recommend for you";


  PRODUCTS.forEach((p,index)=>{

    productsBox.appendChild(
      card(p,index)
    );

  });

}


/* =====================================================
   LIVE SEARCH
===================================================== */

function liveSearch(value){

  const q=
    value.trim().toLowerCase();


  if(q===""){

    clear.style.display="none";

    trendingSection.style.display=
      "block";

    showAll();

    return;

  }


  clear.style.display=
    "block";

  trendingSection.style.display=
    "none";


  const results=
    PRODUCTS.filter(p=>{

      const text=(
        p.name+" "+
        p.category+" "+
        description(p)
      ).toLowerCase();

      return text.includes(q);

    });


  productsBox.innerHTML="";


  heading.textContent=
    "🔍 Search Results ("+
    results.length+
    ")";


  if(results.length===0){

    productsBox.innerHTML=`

      <div class="empty">

        <div style="font-size:42px">
          😔
        </div>

        <strong>
          Product नहीं मिला
        </strong>

        <br><br>

        दूसरा product name try करें.

      </div>

    `;

    return;

  }


  results.forEach((p,index)=>{

    productsBox.appendChild(
      card(p,index)
    );

  });

}


/* =====================================================
   LIVE INPUT
===================================================== */

search.addEventListener(
  "input",
  ()=>{
    liveSearch(search.value);
  }
);


/* =====================================================
   CLEAR
===================================================== */

clear.onclick=()=>{

  search.value="";

  search.focus();

  liveSearch("");

};

    


/* =====================================================
   START
===================================================== */

showAll();

</script>
