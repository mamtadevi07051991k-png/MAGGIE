<style>
html,body{touch-action:manipulation;-ms-touch-action:manipulation;overscroll-behavior-x:none;}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#f7f4ed;
    color:#17130d;
}

button{
    font-family:inherit;
    cursor:pointer;
    border:0;
}

img{
    display:block;
    width:100%;
}


/* ==============================
   HEADER
================================ */

.header{

    height:64px;

    display:flex;
    align-items:center;

    padding:0 15px;

    background:rgba(255,253,248,.96);

    border-bottom:1px solid #ebe5d9;

    position:sticky;
    top:0;

    z-index:100;

    backdrop-filter:blur(18px);
}

.back-btn{

    width:42px;
    height:42px;

    border-radius:14px;

    background:#fff;

    font-size:26px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 5px 18px rgba(0,0,0,.07);
}

.logo-title{

    flex:1;

    text-align:center;

    font-size:17px;

    font-weight:900;
}

.cart-btn{

    width:42px;
    height:42px;

    border-radius:14px;

    background:#18140e;

    color:#ffd447;

    font-size:19px;

    position:relative;
}

.cart-count{

    position:absolute;

    top:-5px;
    right:-5px;

    min-width:18px;
    height:18px;

    padding:0 4px;

    border-radius:20px;

    background:#d8aa28;

    color:#17130d;

    font-size:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:900;
}


/* ==============================
   MAIN PRODUCT
================================ */

.product-container{

    padding:14px;
}

.product-image-box{

    width:100%;
    height:330px;

    border-radius:28px;

    overflow:hidden;

    background:#eee8dc;

    position:relative;

    box-shadow:
        0 18px 45px rgba(38,27,9,.12);
}

.product-image{

    width:100%;
    height:100%;

    object-fit:cover;
}

.veg-badge{

    position:absolute;

    top:15px;
    left:15px;

    background:rgba(255,255,255,.95);

    padding:8px 12px;

    border-radius:30px;

    font-size:11px;

    font-weight:900;

    color:#13763a;

    box-shadow:0 5px 18px rgba(0,0,0,.1);
}


/* ==============================
   PRODUCT INFORMATION
================================ */

.product-info{

    padding:21px 4px 10px;
}

.category{

    color:#a67d17;

    font-size:11px;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:1.2px;

    margin-bottom:7px;
}

.product-name{

    font-size:28px;

    line-height:1.15;

    font-weight:900;

    letter-spacing:-.7px;

    margin-bottom:11px;
}

.rating-row{

    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:14px;
}

.rating{

    background:#198542;

    color:white;

    padding:6px 9px;

    border-radius:9px;

    font-size:12px;

    font-weight:900;
}

.rating-text{

    font-size:12px;

    color:#777064;

    font-weight:700;
}

.description{

    color:#696258;

    font-size:14px;

    line-height:1.65;

    margin-bottom:15px;
}

.price{

    font-size:25px;

    font-weight:900;

    margin-bottom:17px;
}


/* ==============================
   BUTTONS
================================ */

.action-row{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-bottom:30px;
}

.add-cart{

    height:50px;

    border-radius:15px;

    background:white;

    border:1px solid #dcd3c4;

    font-size:13px;

    font-weight:900;

    color:#17130d;
}

.buy-now{

    height:50px;

    border-radius:15px;

    background:#18140e;

    color:#ffd447;

    font-size:13px;

    font-weight:900;

    box-shadow:
        0 10px 25px rgba(24,20,14,.2);
}


/* ==============================
   RECOMMENDED
================================ */

.recommended{

    padding:5px 14px 45px;
}

.recommended-heading{

    margin-bottom:17px;
}

.recommended-heading h2{

    font-size:23px;

    font-weight:900;

    letter-spacing:-.5px;
}

.recommended-heading p{

    margin-top:4px;

    font-size:11px;

    color:#91897b;

    font-weight:700;
}


/* ==============================
   RECOMMENDED CARD
================================ */

.recommend-grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:13px;
}

.recommend-card{

    background:#fff;

    border:1px solid #eee7db;

    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 8px 25px rgba(40,28,10,.07);

    transition:.15s;
}

.recommend-card:active{

    transform:scale(.97);
}

.recommend-image-box{

    height:145px;

    position:relative;

    overflow:hidden;

    background:#eee8dc;
}

.recommend-image{

    width:100%;
    height:100%;

    object-fit:cover;
}

.recommend-veg{

    position:absolute;

    left:8px;
    top:8px;

    background:white;

    color:#13763a;

    padding:5px 7px;

    border-radius:7px;

    font-size:9px;

    font-weight:900;
}

.recommend-info{

    padding:11px;
}

.recommend-name{

    font-size:14px;

    font-weight:900;

    line-height:1.3;

    margin-bottom:7px;
}

.recommend-rating{

    font-size:11px;

    color:#16833e;

    font-weight:800;

    margin-bottom:7px;
}

.recommend-description{

    font-size:11px;

    color:#81796d;

    line-height:1.45;

    margin-bottom:8px;
}

.recommend-bottom{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:7px;
}

.recommend-price{

    font-size:15px;

    font-weight:900;
}

.view-btn{

    padding:7px 11px;

    border-radius:10px;

    background:#18140e;

    color:#ffd447;

    font-size:10px;

    font-weight:900;
}


/* ==============================
   EMPTY STATE
================================ */

.empty{

    padding:60px 20px;

    text-align:center;

    color:#8c8477;

    font-size:14px;

    font-weight:700;
}


/* ==============================
   TOAST
================================ */

.toast{

    position:fixed;

    left:50%;

    bottom:22px;

    transform:
        translate(-50%,100px);

    background:#18140e;

    color:white;

    padding:13px 18px;

    border-radius:14px;

    font-size:12px;

    font-weight:800;

    opacity:0;

    transition:.25s;

    z-index:999;
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}


/* ==============================
   DESKTOP
================================ */

@media(min-width:700px){

    body{
        max-width:1100px;
        margin:auto;
    }

    .product-image-box{
        height:480px;
    }

    .recommend-grid{
        grid-template-columns:
            repeat(4,1fr);
    }

    .recommend-image-box{
        height:180px;
    }
}

function getProduct(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const id =
        params.get("id");


    /* URL ID se product find karo */

    if(id){

        const product =
            PRODUCTS.find(function(product){

                return String(product.id) ===
                       String(id);

            });

        if(product){

            return product;

        }

    }


    /* Home page se saved product */

    try{

        const savedProduct =
            localStorage.getItem(
                "selectedProduct"
            );

        if(savedProduct){

            return JSON.parse(
                savedProduct
            );

        }

    }catch(error){

        console.error(
            "Selected product error:",
            error
        );

    }


    /* Kuch bhi na mile */

    return null;
}


/* ==============================
   OPEN PRODUCT
================================ */

function openProduct(id){

    const product =
        PRODUCTS.find(
            item =>
                String(item.id) === String(id)
        );

    if(!product) return;


    localStorage.setItem(
        "selectedProduct",
        JSON.stringify(product)
    );


    window.location.href =
        "product.html?id=" +
        encodeURIComponent(id);

}

  /* ==========================================
   SELECTED PRODUCT FROM HOME PAGE
========================================== */

let selectedProduct = null;

try {
    const savedProduct =
        localStorage.getItem("selectedProduct");

    if (savedProduct) {
        selectedProduct =
            JSON.parse(savedProduct);
    }
} catch (error) {
    console.error(
        "Selected product error:",
        error
    );
}


/* ==============================

=============================== */

if (selectedProduct) {

    console.log(

        selectedProduct

} else {

    );

}

function renderRecommendations(){

    const current =
        getProduct();


    const grid =
        document.getElementById(
            "recommendGrid"
        );


    if(!grid) return;


    const products =
        PRODUCTS.filter(
            product =>
                !current ||
                product.id !== current.id
        );


    if(products.length === 0){

        grid.innerHTML = `

            <div class="empty">

                More products coming soon.

            </div>

        `;

        return;

    }


    grid.innerHTML =
        products.map(
            product => `

                <article
                    class="recommend-card"
                    onclick="
                        openProduct('${product.id}')
                    ">


                    <div
                        class="recommend-image-box">

                        <img
                            class="recommend-image"
                            src="${product.image}"
                            alt="${product.name}"
                            loading="lazy"
                        >

                        <span
                            class="recommend-veg">

                            🟢 VEG

                        </span>

                    </div>



                    <div class="recommend-info">


                        <div
                            class="recommend-name">

                            ${product.name}

                        </div>


                        <div
                            class="recommend-rating">

                            ★ ${product.rating}

                        </div>


                        <div
                            class="recommend-description">

                            ${product.description}

                        </div>


                        <div
                            class="recommend-bottom">


                            <span
                                class="recommend-price">

                                ₹${product.price}

                            </span>


                            <button
                                class="view-btn"
                                onclick="
                                    event.stopPropagation();
                                    openProduct('${product.id}');
                                ">

                                View

                            </button>


                        </div>

                    </div>

                </article>

            `
        )
        .join("");

}

function getCart(){

    try{

        return JSON.parse(
            localStorage.getItem("maggieCart")
        ) || [];

    }catch{

        return [];

    }

}


function addToCart(){

    const product = getProduct();

    if(!product){
        return;
    }

    let cart = [];

    try{

        const savedCart =
            localStorage.getItem("maggieCart");

        if(savedCart){

            const parsedCart =
                JSON.parse(savedCart);

            if(Array.isArray(parsedCart)){
                cart = parsedCart;
            }

        }

    }catch(error){

        console.error(
            "Cart read error:",
            error
        );

        cart = [];
    }


    const existing =
        cart.find(function(item){

            return String(item.id) ===
                   String(product.id);

        });


    if(existing){

        existing.qty =
            Number(existing.qty || 0) + 1;

    }else{

        cart.push({

            id: product.id,

            name: product.name,

            price: Number(product.price || 0),

            image: product.image || "",

            category:
                product.category ||
                product.cat ||
                "",

            cat:
                product.cat ||
                product.category ||
                "",

            description:
                product.description || "",

            rating:
                product.rating || "",

            tags:
                product.tags || [],

            qty: 1

        });

    }


    localStorage.setItem(
        "maggieCart",
        JSON.stringify(cart)
    );


    updateCartCount();


    showToast(
        "Added to Cart ✓"
    );

          }



/* ==============================
   BUY NOW
================================ */

function buyNow(){

    const product =
        getProduct();

    if(!product) return;


    const buyNowProduct = {

        id:product.id,

        name:product.name,

        price:product.price,

        image:product.image,

        quantity:1

    };


    localStorage.setItem(
        "buyNowProduct",
        JSON.stringify(
            buyNowProduct
        )
    );


    window.location.href =
        "buy.now.html";

}



/* ==============================
   CART COUNT
================================ */

function updateCartCount(){

    const cart =
        getCart();


    const count =
        cart.reduce(
            (total,item) =>
                total +
                Number(
                    item.quantity || 0
                ),
            0
        );


    const element =
        document.getElementById(
            "cartCount"
        );


    if(element){

        element.textContent =
            count > 99
                ? "99+"
                : count;

    }

}

function goBack(){

    if(
        document.referrer &&
        document.referrer.includes(
            window.location.hostname
        )
    ){

        history.back();

    }else{

        window.location.href =
            "index.html";

    }

}

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}



/* ==============================
   START
================================ */

showProduct();

</script>
