<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Categories • Maggie Lover</title>

<style>
html,body{touch-action:manipulation;-ms-touch-action:manipulation;overscroll-behavior-x:none;}


*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:#fffaf3;
  color:#24170e;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font:inherit;
  cursor:pointer;
}

.page{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:15px 15px 95px;
}

/* HEADER */

.topbar{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}

.back-btn{
  width:43px;
  height:43px;
  border:0;
  border-radius:14px;
  background:#fff;
  color:#24170e;
  font-size:22px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.brand{
  flex:1;
}

.brand-label{
  color:#f58225;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
}

.brand-title{
  margin-top:2px;
  font-size:21px;
  font-weight:900;
}

.brand-subtitle{
  margin-top:2px;
  color:#8a7b6c;
  font-size:11px;
}

.brand-icon{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#fff0dc;
  font-size:22px;
}

/* SEARCH */

.search-box{
  width:100%;
  height:54px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 15px;
  border:1px solid #eee1d2;
  border-radius:17px;
  background:#fff;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.search-icon{
  font-size:19px;
}

.search-placeholder{
  color:#918579;
  font-size:13px;
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  margin-top:17px;
  padding:23px 21px;
  border-radius:23px;
  background:linear-gradient(135deg,#ffb347,#f47720);
  color:#fff;
  box-shadow:0 10px 27px rgba(244,119,32,.20);
}

.hero::after{
  content:"🍜";
  position:absolute;
  right:18px;
  bottom:-8px;
  font-size:78px;
  opacity:.18;
  transform:rotate(-10deg);
}

.hero-title{
  position:relative;
  z-index:1;
  font-size:22px;
  font-weight:900;
  margin-bottom:7px;
}

.hero-text{
  position:relative;
  z-index:1;
  max-width:80%;
  font-size:12px;
  line-height:1.55;
}

/* CATEGORY CHIPS */

.category-scroll{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:17px 0 5px;
  scrollbar-width:none;
}

.category-scroll::-webkit-scrollbar{
  display:none;
}

.category-chip{
  flex:0 0 auto;
  padding:10px 15px;
  border:0;
  border-radius:22px;
  background:#fff;
  color:#634d39;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.category-chip.active{
  background:#f58225;
  color:#fff;
}

/* SECTION */

.section-header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;
  margin-top:23px;
  margin-bottom:14px;
}

.section-title{
  font-size:20px;
  font-weight:900;
}

.product-count{
  color:#8a7968;
  font-size:11px;
  font-weight:800;
}

/* CATEGORY CARDS */

.category-list{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

.category-card{
  position:relative;
  height:165px;
  overflow:hidden;
  border-radius:22px;
  background:#eee;
  box-shadow:0 7px 20px rgba(0,0,0,.09);
  cursor:pointer;
}

.category-card img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.category-gradient{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:18px;
  background:linear-gradient(
    transparent 20%,
    rgba(0,0,0,.82)
  );
  color:#fff;
}

.category-name{
  font-size:19px;
  font-weight:900;
  margin-bottom:5px;
}

.category-info{
  font-size:11px;
  opacity:.9;
}

/* PRODUCTS */

.products-section{
  margin-top:28px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.product-card{
  overflow:hidden;
  border-radius:19px;
  background:#fff;
  box-shadow:0 6px 19px rgba(0,0,0,.075);
  cursor:pointer;
}

.product-image-wrap{
  position:relative;
  width:100%;
  height:145px;
  background:#f1e9df;
  overflow:hidden;
}

.product-image{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.rating{
  position:absolute;
  top:8px;
  right:8px;
  padding:5px 8px;
  border-radius:10px;
  background:rgba(255,255,255,.95);
  font-size:10px;
  font-weight:900;
}

.product-info{
  padding:11px;
}

.product-name{
  font-size:13px;
  line-height:1.3;
  font-weight:900;
  margin-bottom:5px;
}

.product-description{
  color:#81766c;
  font-size:10px;
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:28px;
  margin-bottom:9px;
}

.product-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}

.product-price{
  font-size:15px;
  font-weight:900;
}

.add-btn{
  border:0;
  border-radius:10px;
  padding:7px 10px;
  background:#f58225;
  color:#fff;
  font-size:10px;
  font-weight:900;
}

/* MESSAGE */

.message-box{
  grid-column:1/-1;
  padding:50px 18px;
  text-align:center;
  border-radius:20px;
  background:#fff;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.message-icon{
  font-size:40px;
  margin-bottom:10px;
}

.message-title{
  font-size:16px;
  font-weight:900;
  margin-bottom:5px;
}

.message-text{
  color:#8b8178;
  font-size:11px;
  line-height:1.5;
}

/* NAV */

.bottom-nav{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:1100px;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(255,255,255,.98);
  border-top:1px solid #eee1d2;
  box-shadow:0 -5px 20px rgba(0,0,0,.07);
}

.nav-item{
  text-decoration:none;
  color:#81776f;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  min-width:50px;
  font-size:20px;
}

.nav-item small{
  font-size:9px;
  font-weight:800;
}

.nav-item.active{
  color:#f58225;
}

/* RESPONSIVE */

@media(min-width:650px){

  .category-list{
    grid-template-columns:repeat(2,1fr);
  }

  .products{
    grid-template-columns:repeat(3,1fr);
  }

  .product-image-wrap{
    height:180px;
  }

}

@media(min-width:1000px){

  .products{
    grid-template-columns:repeat(4,1fr);
  }

}
  

</style>

<script src="products.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function(){

/* =================================================
   GET PRODUCTS
================================================= */

const allProducts =
  Array.isArray(window.products)
    ? window.products
    : [];


/* =================================================
   ELEMENTS
================================================= */

const categoryChips =
  document.getElementById("categoryChips");

const categoryList =
  document.getElementById("categoryList");

const productList =
  document.getElementById("productList");

const productTitle =
  document.getElementById("productTitle");

const productCount =
  document.getElementById("productCount");

const backBtn =
  document.getElementById("backBtn");

const searchBox =
  document.getElementById("searchBox");


/* =================================================
   DATA CHECK
================================================= */

console.log(
  "Maggie Lover products:",
  allProducts.length
);


/* =================================================
   BACK
================================================= */

backBtn.addEventListener(
  "click",
  function(){

    if(history.length > 1){

      history.back();

    }else{

      window.location.href =
        "index.html";

    }

  }
);


/* =================================================
   SEARCH
================================================= */

searchBox.addEventListener(
  "click",
  function(){

    window.location.href =
      "search.html";

  }
);


/* =================================================
   IF DATA NOT AVAILABLE
================================================= */

if(!allProducts.length){

  categoryList.innerHTML = `

    <div class="message-box">

      <div class="message-icon">
        ⚠️
      </div>

      <div class="message-title">
        Products load nahi hue
      </div>

      <div class="message-text">
        products.js file load nahi hui.
      </div>

    </div>

  `;

  productList.innerHTML = `

    <div class="message-box">

      <div class="message-icon">
        🍜
      </div>

      <div class="message-title">
        Products load nahi hue
      </div>

      <div class="message-text">
        Please products.js ka path check karein.
      </div>

    </div>

  `;

  return;

}


/* =================================================
   UNIQUE CATEGORIES
================================================= */

const realCategories = [
  ...new Set(
    allProducts
      .map(function(product){

        return product.category;

      })
      .filter(function(category){

        return category;

      })
  )
];


/* =================================================
   ALL + CATEGORIES
================================================= */

const categories = [
  "All",
  ...realCategories
];


/* =================================================
   CATEGORY CHIPS
================================================= */

categoryChips.innerHTML = "";

categories.forEach(
  function(category,index){

    const button =
      document.createElement("button");

    button.type = "button";

    button.className =
      "category-chip" +
      (index === 0 ? " active" : "");

    button.textContent =
      category;

    button.addEventListener(
      "click",
      function(){

        setActiveChip(category);

        if(category === "All"){

          renderProducts(
            allProducts,
            "🔥 All Products"
          );

        }else{

          const filtered =
            allProducts.filter(
              function(product){

                return (
                  product.category ===
                  category
                );

              }
            );

          renderProducts(
            filtered,
            category
          );

        }

        document
          .querySelector(".products-section")
          .scrollIntoView({
            behavior:"smooth"
          });

      }
    );

    categoryChips.appendChild(button);

  }
);


/* =================================================
   ACTIVE CHIP
================================================= */

function setActiveChip(category){

  document
    .querySelectorAll(".category-chip")
    .forEach(
      function(chip){

        chip.classList.toggle(
          "active",
          chip.textContent === category
        );

      }
    );

}


/* =================================================
   CATEGORY IMAGES
================================================= */

const categoryImages = {

  "World Famous Handi Maggi":
   "assets/products/veg-handi-maggi.webp",

  "Premium Handi Maggi":
    "assets/products/paneer-cheese-handi-maggi.webp",

  "Maggi Bowl":
    "assets/products/chinese-maggi.webp",

  "Dry Lover Maggi":
    "assets/products/butter-maggi.webp",

  "Classic Pasta":
    "assets/products/pasta.webp",

  "Premium Pasta":
    "assets/products/volcano-cheese-pasta.webp",

  "Paneer Lover":
    "assets/products/butter-paneer.webp",

  "Manchurian Lover":
    "assets/products/handi-manchurian.webp",

  "Aata Momos":
    "assets/products/gravy-momo.webp",

  "Pizza":
    "assets/products/skull-pizza.webp"

};


/* =================================================
   CATEGORY CARDS
================================================= */

categoryList.innerHTML = "";

realCategories.forEach(
  function(category){

    const categoryProducts =
      allProducts.filter(
        function(product){

          return (
            product.category ===
            category
          );

        }
      );


    const firstProduct =
      categoryProducts[0];


    const card =
      document.createElement("div");

    card.className =
      "category-card";


    const image =
      categoryImages[category] ||
      (
        firstProduct
          ? firstProduct.image
          : ""
      );


    card.innerHTML = `

      <img
        src="${image}"
        alt="${category}"
        loading="lazy"
      >

      <div class="category-gradient">

        <div class="category-name">
          ${category}
        </div>

        <div class="category-info">
          ${categoryProducts.length}
          Products • Tap to explore
        </div>

      </div>

    `;


    card.addEventListener(
      "click",
      function(){

        setActiveChip(category);

        renderProducts(
          categoryProducts,
          category
        );

        document
          .querySelector(".products-section")
          .scrollIntoView({
            behavior:"smooth"
          });

      }
    );


    categoryList.appendChild(card);

  }
);


/* =================================================
   RENDER PRODUCTS
================================================= */

function renderProducts(
  productsToShow,
  title
){

  productList.innerHTML = "";

  productTitle.textContent =
    title;

  productCount.textContent =
    productsToShow.length +
    " Products";


  if(!productsToShow.length){

    productList.innerHTML = `

      <div class="message-box">

        <div class="message-icon">
          🍜
        </div>

        <div class="message-title">
          No Products Found
        </div>

        <div class="message-text">
          Is category mein koi product available nahi hai.
        </div>

      </div>

    `;

    return;

  }


  productsToShow.forEach(
    function(product){

      const card =
        document.createElement("article");

      card.className =
        "product-card";


      card.innerHTML = `

        <div class="product-image-wrap">

          <img
            class="product-image"
            src="${product.image || ""}"
            alt="${product.name || "Product"}"
            loading="lazy"
          >

          <div class="rating">
            ⭐ 4.8
          </div>

        </div>

        <div class="product-info">

          <h3 class="product-name">
            ${product.name || "Unnamed Product"}
          </h3>

          <p class="product-description">
            ${product.description || ""}
          </p>

          <div class="product-bottom">

            <span class="product-price">
              ₹${product.price || 0}
            </span>

            <button
              class="add-btn"
              type="button"
            >
              ADD
            </button>

          </div>

        </div>

      `;


      card.addEventListener(
  "click",
  function(event) {

    // ADD button par click = sirf cart action
    if (
      event.target.closest(".add-btn")
    ) {
      return;
    }

    // Exact clicked product save karo
    localStorage.setItem(
      "selectedProduct",
      JSON.stringify(product)
    );

    // Product detail page open karo
    window.location.href =
      "product.html";
  }
);


      /* =========================================
         ADD TO CART
      ========================================= */

      const addButton =
        card.querySelector(".add-btn");


      addButton.addEventListener(
        "click",
        function(event){

          event.stopPropagation();


          let cart = [];


          try{

            cart =
              JSON.parse(
                localStorage.getItem("maggieCart")
              ) || [];

          }catch(error){

            cart = [];

          }


          const existing =
            cart.find(
              function(item){

                return String(item.id) ===
                       String(product.id);

              }
            );


          if(existing){

            existing.qty =
              (existing.qty || 1) + 1;

          }else{

            cart.push({

              id:product.id,

              name:product.name,

              price:product.price,

              image:product.image,

              qty:1

            });

          }


          localStorage.setItem(
            "maggieCart",
            JSON.stringify(cart)
          );


          addButton.textContent =
            "✓ ADDED";


          setTimeout(
            function(){

              addButton.textContent =
                "ADD";

            },
            1200
          );

        }
      );


      productList.appendChild(card);

    }
  );

}


/* =================================================
   INITIAL LOAD
================================================= */

renderProducts(
  allProducts,
  "🔥 All Products"
);
document.addEventListener("maggie:catalog-updated", function(){ renderProducts(allProducts, "🔥 All Products"); });

});

</script>
